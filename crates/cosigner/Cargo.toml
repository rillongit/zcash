[package]
name = "cosigner"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
description = "FROST 2-of-3 policy share for a Zcash agent"

[dependencies]
frost-rerandomized = { version = "=2.0.0-rc.0", default-features = false, features = ["serialization", "serde"] }
hex = { workspace = true }
mandate = { workspace = true }
pczt-inspect = { workspace = true }
rand = "0.8"
reddsa = { git = "https://github.com/ZcashFoundation/reddsa.git", rev = "ed49e9ca0699a6450f6d4a9fe62ff168f5ea1ead", default-features = false, features = ["frost", "serde", "std"] }
serde_json = { workspace = true }
