services:
  zcashd:
    image: electriccoinco/zcashd:latest
    container_name: rill-zcashd-regtest
    platform: linux/amd64
    environment:
      ZCASHD_NETWORK: regtest
      ZCASHD_RPCUSER: rill
      ZCASHD_RPCPASSWORD: regtest
      ZCASHD_RPCBIND: 0.0.0.0
      ZCASHD_ALLOWIP: 0.0.0.0/0
      ZCASHD_TXINDEX: "1"
    command:
      - "-regtest"
      - "-listen=1"
      - "-bind=0.0.0.0"
      - "-port=18444"
      - "-txindex=1"
      - "-deprecatedrpc=getnewaddress"
      - "-deprecatedrpc=z_getnewaddress"
      - "-deprecatedrpc=z_getbalance"
      - "-i-am-aware-zcashd-will-be-replaced-by-zebrad-and-zallet-in-2025=1"
    ports:
      - "127.0.0.1:18232:18232"
    volumes:
      - zcash-data:/srv/zcashd/.zcash
      - zcash-params:/srv/zcashd/.zcash-params
      - ./docker/zcash.conf:/srv/zcashd/.zcash/zcash.conf

  zcashd-observer:
    image: electriccoinco/zcashd:latest
    container_name: rill-zcashd-observer
    platform: linux/amd64
    depends_on:
      - zcashd
    environment:
      ZCASHD_NETWORK: regtest
      ZCASHD_RPCUSER: rill
      ZCASHD_RPCPASSWORD: regtest
      ZCASHD_RPCBIND: 0.0.0.0
      ZCASHD_ALLOWIP: 0.0.0.0/0
      ZCASHD_TXINDEX: "1"
    command:
      - "-regtest"
      - "-listen=0"
      - "-connect=zcashd:18444"
      - "-txindex=1"
      - "-deprecatedrpc=getnewaddress"
      - "-deprecatedrpc=z_getnewaddress"
      - "-deprecatedrpc=z_getbalance"
      - "-i-am-aware-zcashd-will-be-replaced-by-zebrad-and-zallet-in-2025=1"
    ports:
      - "127.0.0.1:18233:18232"
    volumes:
      - zcash-observer-data:/srv/zcashd/.zcash
      - zcash-params:/srv/zcashd/.zcash-params
      - ./docker/zcash-observer.conf:/srv/zcashd/.zcash/zcash.conf

volumes:
  zcash-data:
  zcash-params:
  zcash-observer-data:
