[workspace]
resolver = "2"
members = [
    "crates/mandate",
    "crates/pczt-inspect",
    "crates/cosigner",
    "crates/agent-signer",
]

[workspace.package]
edition = "2021"
license = "MIT"
publish = false
rust-version = "1.85"

[workspace.dependencies]
agent-signer = { path = "crates/agent-signer" }
cosigner = { path = "crates/cosigner" }
hex = "0.4"
mandate = { path = "crates/mandate" }
pczt-inspect = { path = "crates/pczt-inspect" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
